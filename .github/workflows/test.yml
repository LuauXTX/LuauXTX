name: Native runtime tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux software-rendering test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers fonts-dejavu-core libxkbcommon-x11-0
      - name: Test native module loading and runtime APIs
        run: cargo test --locked -p luauxtx
      - name: Exercise GPU pixels and real windows on a software adapter
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LUAUXTX_REQUIRE_GPU: '1'
        run: |
          cargo test --locked -p luauxtx --lib gpu_pixels -- --nocapture
          xvfb-run -a cargo test --locked -p luauxtx --test graphics -- --ignored --test-threads=1
