[package]
name = "luauxtx"
version = "0.1.0"
edition = "2024"
description = "A small Luau runtime hosted by Rust"
license = "MIT"

[workspace]
members = ["web"]
resolver = "2"

[lib]
crate-type = ["rlib"]

[dependencies]
mlua = { version = "0.12.1", features = ["async", "luau", "vendored"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0"
wgpu = "30"
winit = "0.30.12"
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.20.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon-dl = { version = "0.4.2", features = ["x11"] }

[patch.crates-io]
mlua = { path = "vendor/mlua" }
